[pytest]
testpaths = tests
addopts = -ra --tb=short
pythonpath = .
log_cli = false
log_file = artifacts/logs/pytest.log
log_file_level = DEBUG
log_format = %(asctime)s %(levelname)-8s [%(name)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: quick DUT and UART readiness checks
    common: behavior shared by firmware 2.1.0 and 2.3.0
    v210: firmware 2.1.0 only
    v230: firmware 2.3.0 only
    ota: OTA checks; some tests reboot or replace firmware
    destructive: changes firmware, credentials, or persistent state
